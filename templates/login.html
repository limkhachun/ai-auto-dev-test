<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h2>Log In</h2>

            <!-- Tab Switch -->
            <div class="tab-switch">
                <button class="tab-btn active" data-tab="user" onclick="switchTab('user')">User Login</button>
                <button class="tab-btn" data-tab="staff" onclick="switchTab('staff')">Staff/Admin Login</button>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" id="login_type" name="login_type" value="user">

                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username or email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary">Log In</button>
            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">Register</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
