<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Orders Tab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('admin.admin_dashboard') }}" class="nav-brand">Admin Panel</a>
            <div class="nav-links">
                <a href="{{ url_for('admin.admin_dashboard') }}" class="nav-link">Dashboard</a>
                <a href="{{ url_for('auth.logout') }}" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <h1 class="page-title">Orders Overview</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <p style="color:white;">View all orders from the <a href="{{ url_for('admin.admin_dashboard') }}" style="color:white;text-decoration:underline;">Admin Dashboard</a>.</p>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
