<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Audit Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('admin.admin_dashboard') }}" class="nav-brand">Admin Panel</a>
            <div class="nav-links">
                <a href="{{ url_for('admin.admin_dashboard') }}" class="nav-link">Dashboard</a>
                <a href="{{ url_for('auth.logout') }}" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <h1 class="page-title">Audit Logs</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card">
            <p>View audit logs from the Admin Dashboard.</p>
            <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
